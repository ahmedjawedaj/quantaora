name: Bug report
description: Report a reproducible problem in the app.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Quantaora. Do not include children's personal information.
  - type: input
    id: route
    attributes:
      label: Affected route or lab
      placeholder: https://quantaora.vercel.app/app/labs/branch/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device type
      options: [Desktop, Tablet, Mobile phone, Other]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 145, Safari 19, Firefox 147
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console details
      description: Drag screenshots here. Remove identifying information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no private learner data or credentials.
          required: true
