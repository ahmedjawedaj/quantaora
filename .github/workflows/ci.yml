name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: quantaora-app

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quantaora-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and code quality
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check curriculum generation parity
        run: npm run codegen:check

      - name: Check product quality coverage
        run: npm run quality:gaps

      - name: Check registered assets and licenses
        run: npm run assets:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production app
        run: npm run build
